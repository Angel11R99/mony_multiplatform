name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK
        if: runner.os == 'Linux'
        run: flutter build apk --debug --dart-define=APP_ENV=staging
      - name: Build iOS simulator app
        if: runner.os == 'macOS'
        run: flutter build ios --simulator --debug --dart-define=APP_ENV=staging
